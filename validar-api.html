<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Validar API do CarWay</title>
<style>
  :root{
    --bg:#0b1120; --card:#16213b; --linha:#26365c;
    --txt:#e8eefc; --txt2:#93a4c8; --azul:#3b82f6;
    --verde:#22c55e; --vermelho:#ef4444; --amarelo:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;padding:24px 16px;background:var(--bg);color:var(--txt);
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
    font-size:15px;line-height:1.55}
  .caixa{max-width:720px;margin:0 auto}
  h1{font-size:23px;margin:0 0 6px}
  .sub{color:var(--txt2);font-size:13.5px;margin:0 0 22px}
  label{display:block;font-size:11.5px;color:var(--txt2);
    text-transform:uppercase;letter-spacing:.5px;margin:14px 0 6px}
  input{width:100%;background:var(--card);border:1px solid var(--linha);
    color:var(--txt);border-radius:11px;padding:13px;font-size:14px;
    font-family:inherit}
  input:focus{outline:0;border-color:var(--azul)}
  button{width:100%;border:0;border-radius:12px;padding:15px;
    font-size:14.5px;font-weight:700;cursor:pointer;color:#fff;
    background:linear-gradient(135deg,var(--azul),#6366f1);margin:18px 0 20px}
  button:active{transform:scale(.99)}
  button:disabled{opacity:.5;cursor:not-allowed}
  .res{background:var(--card);border:1px solid var(--linha);
    border-left:4px solid var(--linha);border-radius:12px;
    padding:13px 15px;margin-bottom:10px}
  .res.ok{border-left-color:var(--verde)}
  .res.erro{border-left-color:var(--vermelho)}
  .res.rodando{border-left-color:var(--amarelo)}
  .res b{display:block;font-size:14px;margin-bottom:4px}
  .res small{display:block;font-size:12.5px;color:var(--txt2)}
  pre{background:#0a1020;border:1px solid var(--linha);border-radius:9px;
    padding:11px;overflow-x:auto;font-size:11.5px;color:#a5d6ff;
    margin:8px 0 0;white-space:pre-wrap;word-break:break-word;max-height:260px}
  .final{border-radius:16px;padding:18px;margin:20px 0;display:none;
    font-size:14.5px}
  .final.mostrar{display:block}
  .final.bom{background:rgba(34,197,94,.13);border:1px solid rgba(34,197,94,.4);color:#bbf7d0}
  .final.ruim{background:rgba(239,68,68,.13);border:1px solid rgba(239,68,68,.4);color:#fecaca}
  .final b{display:block;font-size:16px;margin-bottom:6px;color:#fff}
  .aviso{background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.3);
    border-radius:12px;padding:13px 15px;font-size:13px;color:#bfdbfe;
    margin-bottom:18px}
  .aviso b{color:#dbeafe}
</style>
</head>
<body>
<div class="caixa">

  <h1>Validar API do CarWay</h1>
  <p class="sub">
    Confirma que o domínio consegue ler dados reais da sua planilha.
    É o último teste antes de migrar de verdade.
  </p>

  <div class="aviso">
    <b>Onde achar o token de sessão</b><br>
    Rode <code>gerarLinkAcessoMaster()</code> no editor do Apps Script
    e copie o valor de <b>Token</b>. Ou pegue na aba <b>SESSOES</b> da
    planilha, coluna <code>token</code>.
  </div>

  <label for="url">URL /exec do CarWay</label>
  <input id="url" placeholder="https://script.google.com/macros/s/.../exec"
         autocomplete="off" spellcheck="false">

  <label for="token">Token de sessão</label>
  <input id="token" placeholder="cole o token aqui"
         autocomplete="off" spellcheck="false">

  <button id="btn" onclick="rodar()">Rodar os 4 testes</button>

  <div id="final" class="final"></div>
  <div id="saida"></div>

</div>

<script>
var URL_API = '';
var TOKEN = '';

/**
 * Esta e a funcao api() que o CarWay migrado vai usar.
 * Mesma assinatura de hoje: api('carregarApp'), api('salvar', t, r).
 */
function api(funcao) {
  var args = Array.prototype.slice.call(arguments, 1);

  return fetch(URL_API, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({
      funcao: funcao,
      sessao: TOKEN,
      args: args,
      origem: location.origin
    }),
    redirect: 'follow'
  })
  .then(function (r) { return r.text(); })
  .then(function (txt) {
    var j;
    try { j = JSON.parse(txt); }
    catch (e) { throw new Error('Resposta inválida: ' + txt.substring(0, 200)); }

    if (j && j.ok === false) throw new Error(j.erro || 'Erro no servidor');
    return j && j.hasOwnProperty('dados') ? j.dados : j;
  });
}

function bloco(id, classe, titulo, texto, dados) {
  var el = document.getElementById(id);
  if (!el) {
    el = document.createElement('div');
    el.id = id;
    document.getElementById('saida').appendChild(el);
  }
  el.className = 'res ' + classe;
  el.innerHTML = '<b>' + titulo + '</b><small>' + texto + '</small>' +
    (dados ? '<pre>' + dados + '</pre>' : '');
}

function resumo(txt) {
  return JSON.stringify(txt, null, 2).substring(0, 1200);
}

function rodar() {
  URL_API = document.getElementById('url').value.trim();
  TOKEN = document.getElementById('token').value.trim();

  if (!URL_API) return alert('Cole a URL /exec do CarWay.');
  if (!TOKEN) return alert('Cole o token de sessão.');

  var btn = document.getElementById('btn');
  btn.disabled = true;

  document.getElementById('saida').innerHTML = '';
  document.getElementById('final').className = 'final';

  var falhou = false;

  /* 1 - sessao */
  bloco('t1', 'rodando', '⏳ 1 · Validar sessão', 'Conferindo o token…', '');

  api('validarSessao', TOKEN)
    .then(function (d) {
      bloco('t1', 'ok', '✅ 1 · Sessão válida',
        'Identificado: <b>' + (d.nome || '?') + '</b> · perfil ' +
        (d.perfil || '?') + ' · ' + (d.organizacao || '?'),
        resumo(d));
    })
    .catch(function (e) {
      falhou = true;
      bloco('t1', 'erro', '❌ 1 · Sessão recusada', e.message, '');
    })

    /* 2 - perfil */
    .then(function () {
      bloco('t2', 'rodando', '⏳ 2 · Meu perfil', 'Consultando…', '');
      return api('meuPerfil');
    })
    .then(function (d) {
      bloco('t2', 'ok', '✅ 2 · Perfil carregado',
        (d.nome || '?') + ' · ' + (d.email || '?'), resumo(d));
    })
    .catch(function (e) {
      falhou = true;
      bloco('t2', 'erro', '❌ 2 · Falhou', e.message, '');
    })

    /* 3 - carga completa */
    .then(function () {
      bloco('t3', 'rodando', '⏳ 3 · Carregar o app',
        'Esta é a chamada mais pesada. Pode demorar alguns segundos…', '');
      return api('carregarApp');
    })
    .then(function (d) {
      var v = (d.veiculos || []).length;
      var vi = (d.viagens || []).length;
      var a = (d.alertas || []).length;

      bloco('t3', 'ok', '✅ 3 · Dados reais recebidos',
        v + ' veículo(s) · ' + vi + ' viagem(ns) · ' + a + ' alerta(s)',
        resumo({
          veiculos: v, viagens: vi, alertas: a,
          hoje: d.hoje, ehMaster: d.ehMaster,
          resumo: d.resumo
        }));
    })
    .catch(function (e) {
      falhou = true;
      bloco('t3', 'erro', '❌ 3 · Falhou', e.message, '');
    })

    /* 4 - seguranca: funcao fora da whitelist */
    .then(function () {
      bloco('t4', 'rodando', '⏳ 4 · Teste de segurança',
        'Tentando chamar uma função proibida de propósito…', '');
      return api('resetTotalCarWay', 'CONFIRMO_RESET_TOTAL');
    })
    .then(function () {
      falhou = true;
      bloco('t4', 'erro', '❌ 4 · FALHA GRAVE DE SEGURANÇA',
        'Uma função fora da whitelist foi executada. ' +
        'Confira o objeto FUNCOES_PUBLICAS antes de prosseguir.', '');
    })
    .catch(function (e) {
      if (String(e.message).indexOf('nao permitida') > -1 ||
          String(e.message).indexOf('não permitida') > -1) {
        bloco('t4', 'ok', '✅ 4 · Segurança confirmada',
          'A função proibida foi recusada, como esperado.<br>' +
          'Mensagem do servidor: ' + e.message, '');
      } else {
        bloco('t4', 'ok', '✅ 4 · Recusada',
          'A chamada não passou. Mensagem: ' + e.message, '');
      }
    })

    /* veredito */
    .then(function () {
      var f = document.getElementById('final');
      if (falhou) {
        f.className = 'final ruim mostrar';
        f.innerHTML = '<b>Algum teste falhou</b>' +
          'Confira se o bloco v11 foi colado no Codigo.gs e se você ' +
          'republicou a implantação depois disso. O token precisa estar ' +
          'ativo na aba SESSOES.';
      } else {
        f.className = 'final bom mostrar';
        f.innerHTML = '<b>API validada — pode migrar</b>' +
          'O domínio lê dados reais da planilha, a sessão é reconhecida ' +
          'e a whitelist bloqueia o que não é público. ' +
          'Próximo passo: separar Index, Estilos e Script em arquivos ' +
          'estáticos, com service worker e manifest de verdade.';
      }
      btn.disabled = false;
    });
}
</script>
</body>
</html>
